          <rect x="1258" y="186" width="8" height="10"></rect>
          <rect x="1276" y="186" width="8" height="10"></rect>
          <rect x="1320" y="186" width="8" height="10"></rect>

    <!-- near : foreground foliage on the left, circuitry on the right -->
    <div class="hero__layer hero__layer--near" data-depth="1">
      <svg class="hero__foliage" viewBox="0 0 460 240" preserveAspectRatio="xMinYMax meet" focusable="false" role="presentation">

          <path d="M460 40 L360 40 L330 70 L330 150 L300 180 L300 240"></path>
          <path d="M460 110 L400 110 L370 140 L370 240"></path>
          <path d="M460 186 L420 186 L396 210 L396 240"></path>

    <span class="hero__vignette"></span>
    <span class="hero__scan"></span>

  <!-- ============ z2 : content ============ -->
  <div class="hero__content">

    <p class="hero__eyebrow">
      <span class="hero__pulse" aria-hidden="true"></span>
      BİR EFSANENİN DOĞUŞU
    </p>

    <h1 id="hero-title" class="hero__title">
      <span class="hero__title-line" data-text="BERKAY CABBAR" data-name="Berkay Cabbar">BERKAY CABBAR</span>
      <span class="hero__title-shine" aria-hidden="true">BERKAY CABBAR</span>
    </h1>

    <p class="hero__tagline">
      <span class="hero__sr">Goril olarak doğdu. İnsan olarak yükseldi. Efsane olarak kaldı. Evrimin son halkası.</span>
      <span class="hero__type" aria-hidden="true"><span class="hero__type-text" id="hero-type">Goril olarak doğdu.</span><span class="hero__caret"></span></span>
    </p>

    <div class="hero__actions">
      <a class="hero__btn hero__btn--primary" href="#evrim" data-hero-magnetic data-hero-scroll="#evrim">
        <span class="hero__btn-label">EVRİMİ İZLE</span>
        <span class="hero__btn-sheen" aria-hidden="true"></span>
      </a>
      <a class="hero__btn hero__btn--ghost" href="#hikaye" data-hero-magnetic data-hero-scroll="#hikaye">
        <span class="hero__btn-label">EFSANEYİ OKU</span>
        <span class="hero__btn-sheen" aria-hidden="true"></span>
      </a>
    </div>

    <ul class="hero__stats">
      <li class="hero__stat">
        <span class="hero__stat-num">1</span>
        <span class="hero__stat-label">Efsane</span>
      </li>
      <li class="hero__stat">
        <span class="hero__stat-num">%1000</span>
        <span class="hero__stat-label">Karizma</span>
      </li>
      <li class="hero__stat">
        <span class="hero__stat-num">&#8734;</span>
        <span class="hero__stat-label">Enerji</span>
      </li>
    </ul>
  </div>

  <!-- ============ scroll cue ============ -->
  <a class="hero__cue" href="#evrim" data-hero-scroll="#evrim" aria-label="Aşağı kaydır, evrim bölümüne git">
    <span class="hero__cue-line" aria-hidden="true"></span>
    <span class="hero__cue-mouse" aria-hidden="true">
      <svg viewBox="0 0 26 40" focusable="false" role="presentation">
        <rect x="1.5" y="1.5" width="23" height="37" rx="11.5"></rect>
        <circle class="hero__cue-dot" cx="13" cy="12" r="3"></circle>
      </svg>
    </span>
    <span class="hero__cue-label">KAYDIR</span>
  </a>

</section>
